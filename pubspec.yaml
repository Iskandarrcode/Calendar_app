name: tudo_app

description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3+1
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  intl: ^0.19.0
  get_it: ^7.7.0
  flutter_color_picker_plus: ^2.0.1
  zoom_tap_animation: ^1.1.0
  yandex_mapkit: ^4.1.0
  geocoding: ^3.0.0
  geolocator: ^13.0.1
  gap: ^3.0.1
  icons_launcher: ^2.1.7
  rename: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/

icons_launcher:
  image_path: "assets/icons/app_logo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true